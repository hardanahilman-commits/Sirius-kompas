.gcard { text-align: left; padding: 0; border-radius: var(--r); overflow: hidden; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); display: grid; align-content: start; }
.gcard img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; background: #fff; }
.gcard.wide img { aspect-ratio: 16 / 10; object-fit: contain; }
.gcard div { padding: 10px 12px 12px; }
.gcard b { display: block; font-size: .95rem; line-height: 1.3; }
.gcard span { display: block; font-size: .8rem; color: var(--muted); margin-top: 2px; line-height: 1.35; }
.stage { position: relative; border-radius: 14px; overflow: hidden; background: #fff; border: 1px solid var(--line); }
.stage img { display: block; width: 100%; height: auto; }
.pin { position: absolute; transform: translate(-50%, -50%); width: 30px; height: 30px; padding: 0; border-radius: 50%; border: 2.5px solid #fff; background: var(--pc); color: #fff; font: 700 .8rem var(--body); display: grid; place-items: center; box-shadow: 0 2px 8px rgba(0, 0, 0, .35); transition: transform .2s; }
.pin.sel { transform: translate(-50%, -50%) scale(1.3); box-shadow: 0 0 0 5px color-mix(in srgb, var(--pc) 40%, transparent); }
.comp { display: grid; gap: 8px; }
.comp details { border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface); transition: border-color .2s; }
.comp summary { list-style: none; padding: 12px 14px; display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: center; font-weight: 700; cursor: pointer; line-height: 1.35; }
.comp summary::-webkit-details-marker { display: none; }
.comp summary i { width: 26px; height: 26px; border-radius: 50%; background: var(--pc); color: #fff; font-style: normal; font-size: .78rem; display: grid; place-items: center; }
.comp details > div { padding: 0 14px 14px 50px; display: grid; gap: 8px; font-size: .96rem; }
.comp details[open] { border-color: var(--pc); }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; counter-reset: s; }
.steps li { display: grid; grid-template-columns: 34px 1fr; gap: 12px; align-items: start; padding: 12px 14px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); counter-increment: s; line-height: 1.5; }
.steps li::before { content: counter(s); width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--sunk); font-weight: 700; }
.order { display: grid; gap: 8px; }
.order button { text-align: left; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); line-height: 1.45; transition: background .2s, border-color .2s; }
.order button.done { border-color: var(--ok); background: var(--ok-bg); cursor: default; }
.order button.shake { animation: shake .35s; border-color: var(--bad); }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.tool { display: grid; gap: 16px; }
.field { display: grid; gap: 6px; }
.field > label, .field > .lb { font-weight: 700; font-size: .96rem; line-height: 1.35; }
.field .hint { font-size: .84rem; color: var(--muted); }
.num { display: grid; grid-template-columns: 52px 1fr 52px; gap: 8px; align-items: center; max-width: 340px; }
.num button { height: 50px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); font-size: 1.35rem; font-weight: 700; }
.num input { height: 50px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); text-align: center; font: 700 1.25rem var(--mono); width: 100%; min-width: 0; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 9px 15px; font-weight: 700; font-size: .92rem; }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
input[type="date"] { height: 50px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); padding: 0 12px; width: 100%; max-width: 340px; }
.out { border-radius: 16px; padding: 16px 18px; display: grid; gap: 6px; }
.out.ok { background: var(--ok-bg); } .out.warn { background: var(--warn-bg); } .out.alert { background: var(--bad-bg); } .out.idle { background: var(--sunk); }
.out h3 { margin: 0; font: 700 1.25rem/1.28 var(--display); }
.out.ok h3 { color: var(--ok); } .out.warn h3 { color: var(--warn); } .out.alert h3 { color: var(--bad); }
.search { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 60px); z-index: 10; background: var(--bg); padding-block: 4px 10px; }
.search input { width: 100%; padding: 13px 16px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface); color: var(--fg); }
.search input:focus { border-color: var(--accent); outline: none; }
mark { background: color-mix(in srgb, var(--accent) 24%, transparent); color: inherit; border-radius: 3px; padding: 0 1px; }
.empty { color: var(--muted); padding: 28px 6px; text-align: center; }
.lbx { position: fixed; inset: 0; z-index: 60; background: rgba(10, 9, 20, .94); display: grid; grid-template-rows: auto 1fr; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); animation: fade .2s; }
@keyframes fade { from { opacity: 0; } }
.lbx .bar { display: flex; justify-content: flex-end; gap: 6px; padding: 8px max(12px, env(safe-area-inset-right, 0px)) 8px 12px; color: #fff; }
.lbx .ib:hover { background: rgba(255, 255, 255, .12); }
.lbx .sc { overflow: auto; -webkit-overflow-scrolling: touch; display: grid; place-items: center; padding: 8px; }
.lbx .sc img { width: calc(100% * var(--z, 1)); max-width: none; height: auto; background: #fff; border-radius: 6px; }
.toast { position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-weight: 700; font-size: .9rem; z-index: 70; animation: fade .2s; white-space: nowrap; }
.abbr div { display: grid; grid-template-columns: minmax(84px, 30%) 1fr; gap: 12px; padding: 10px 4px; border-bottom: 1px solid var(--line); font-size: .94rem; line-height: 1.45; }
.abbr b { font: 500 .86rem var(--mono); }
.set .card { padding: 16px; display: grid; gap: 10px; }
.navrow { display: flex; gap: 10px; margin-top: 18px; }
.navrow .pri { flex: 1; }
@media (prefers-reduced-motion: reduce) { .enter, .fb, .toast, .lbx, .result { animation: none; } .fc-in, .pin { transition: none; } }

/* ===== Motion layer: Apple-like typography, materials, springs, and transitions ===== */
:root {
  --display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", Roboto, system-ui, sans-serif;
  --body: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --bg: #F2F2F7; --surface: #FFFFFF; --sunk: #E9E9EF; --line: #E2E2E8; --sep: rgba(60, 60, 67, .22); --muted: #64636E;
  --r: 16px; --shadow: 0 1px 1px rgba(0, 0, 0, .03), 0 6px 18px rgba(28, 26, 51, .05);
  --mat: color-mix(in srgb, var(--bg) 84%, transparent);
  --ease: cubic-bezier(.32, .72, 0, 1);
  --spring: linear(0, .009, .035 2.1%, .141, .281 6.7%, .723 12.9%, .938 16.7%, 1.017, 1.077, 1.121, 1.149 24.3%, 1.159, 1.163, 1.161, 1.154 29.9%, 1.129 32.8%, 1.051 39.6%, 1.017 43.1%, .991, .977 51%, .974 53.8%, .975 57.1%, .997 69.8%, 1.003 76.9%, 1);
  --spring-soft: linear(0, .006, .025 2.8%, .101 6.1%, .539 18.9%, .721 25.3%, .849 31.5%, .937 38.1%, .968 41.8%, .991 45.7%, 1.006 50.1%, 1.015 55%, 1.017 63.9%, 1.001 85.2%, 1);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #000000; --surface: #1C1C1E; --sunk: #2C2C2E; --line: #38383A; --sep: rgba(84, 84, 88, .6); --fg: #F5F5F7; --fg2: #D1D1D6; --muted: #A1A1A8; --shadow: none; } }
:root[data-theme="dark"] { --bg: #000000; --surface: #1C1C1E; --sunk: #2C2C2E; --line: #38383A; --sep: rgba(84, 84, 88, .6); --fg: #F5F5F7; --fg2: #D1D1D6; --muted: #A1A1A8; --shadow: none; }
body { letter-spacing: -.011em; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; text-rendering: optimizeLegibility; overscroll-behavior-y: none; }
.h1 { font: 700 clamp(1.95rem, 7.6vw, 2.3rem)/1.1 var(--display); letter-spacing: -.026em; }
.h2 { font: 700 1.38rem/1.22 var(--display); letter-spacing: -.018em; }
.hero h1 { font-family: var(--display); letter-spacing: -.028em; }
.eyebrow, .top .tt small { font: 600 .74rem/1.35 var(--body); letter-spacing: .045em; }
.item .ic { font-family: var(--body); letter-spacing: -.02em; }
.item, .tile, .gcard, .card { border: .5px solid var(--line); }


/* materials */
.top { background: var(--mat); -webkit-backdrop-filter: saturate(180%) blur(22px); backdrop-filter: saturate(180%) blur(22px); border-bottom: .5px solid transparent; transition: border-color .25s; view-transition-name: topbar; }
.top.sh { border-bottom-color: var(--sep); }
.top .tt { text-align: center; transition: opacity .28s var(--ease), transform .4s var(--ease); }
.top.lt:not(.sh) .tt { opacity: 0; transform: translateY(8px); }
.top .tt b { font-size: 1.02rem; letter-spacing: -.015em; }
.nav { background: var(--mat); -webkit-backdrop-filter: saturate(180%) blur(22px); backdrop-filter: saturate(180%) blur(22px); border-top: .5px solid var(--sep); view-transition-name: tabbar; }
.nav button { font-size: .8rem; font-weight: 650; letter-spacing: 0; padding: 10px 4px 12px; gap: 5px; min-height: 64px; align-content: center; }
.nav button svg { width: 31px; height: 31px; transition: transform .5s var(--spring); }
.nav button[aria-current="true"] svg { fill: color-mix(in srgb, var(--accent) 18%, transparent); }
.nav button svg.bnc { animation: bnc .55s var(--spring) both; }
@keyframes bnc { 0% { transform: scale(1); } 28% { transform: scale(.78); } 62% { transform: scale(1.14); } 100% { transform: scale(1); } }

/* touch feedback */
.item, .tile, .btn, .chip, .opt, .gcard, .box.go, .ib, .seg button, .order button, figure, .cont, .tview button, details.fold summary {
  transition: transform .55s var(--spring), filter .25s ease, background-color .2s, border-color .2s, box-shadow .3s; will-change: transform; }
.prs { transform: scale(.965) !important; filter: brightness(.96); transition: transform .12s ease-out, filter .12s ease-out !important; }
.ib.prs, .nav button.prs { transform: scale(.88) !important; background: var(--sunk); }
.nav button.prs { background: none; }
.btn.pri.prs { filter: brightness(.9); }

/* segmented control (settings, tools) */
.seg { background: var(--sunk); border-radius: 11px; padding: 3px; gap: 2px; }
.seg button { border: 0; border-radius: 9px; background: transparent; padding: 8px 14px; font-weight: 600; flex: 1 1 auto; }
.set .seg { flex-wrap: nowrap; }
.set .seg button { white-space: nowrap; min-width: 0; padding: 8px 6px; font-size: .88rem; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 3px 8px rgba(0, 0, 0, .12), 0 0 0 .5px rgba(0, 0, 0, .04); }

/* staggered entrance */
.tile, .item, .gcard, .chip, .btn, .opt, .scard, .pcard { transition: transform .22s var(--ease), background .2s, box-shadow .22s; }
.tile:active, .item:active, .gcard:active, .scard:active, .pcard:active { transform: scale(.965); }
.app:active { transform: none; }
.chip:active, .btn:active, .opt:active { transform: scale(.955); }
/* ===== ikon gaya iOS dan tata letak layar utama ===== */
:root { --icsh: 0 1px 1px rgba(16, 38, 74, .2), 0 4px 10px rgba(16, 38, 74, .16), inset 0 1px 0 rgba(255, 255, 255, .45), inset 0 -1.5px 1px rgba(0, 0, 0, .16); }
.app, .item, .tile, .gcard, .bd { --icg: linear-gradient(180deg, color-mix(in srgb, var(--k, #1565E0) 66%, #fff) 0%, var(--k, #1565E0) 50%, color-mix(in srgb, var(--k, #1565E0) 84%, #000) 100%); }
.appgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px 6px; margin: 2px 0 10px; }
@media (max-width: 349px) { .appgrid { grid-template-columns: repeat(3, 1fr); } }
@media (min-width: 560px) { .appgrid { grid-template-columns: repeat(6, 1fr); } }
.app { display: grid; justify-items: center; gap: 7px; background: none; border: 0; padding: 0; color: inherit; font: inherit; cursor: pointer; }
.app .ic { width: 62px; height: 62px; border-radius: 22.37%; display: grid; place-items: center; background: var(--icg); box-shadow: var(--icsh); transition: transform .2s var(--ease); }
.app .ic svg { width: 33px; height: 33px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.app .ic svg.bic { width: 38px; height: 38px; stroke: none; fill: none; }
.app b { font-size: .78rem; font-weight: 500; line-height: 1.26; text-align: center; letter-spacing: -.008em; color: var(--fg); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; max-width: 86px; }
.app:active .ic { transform: scale(.88); }
.app:focus-visible { outline: none; } .app:focus-visible .ic { outline: 3px solid var(--accent); outline-offset: 3px; }
.tile .ic { background: var(--icg); color: #fff; border-radius: 22.37%; box-shadow: var(--icsh); }
.tile .ic svg { stroke: #fff; }
/* ===== progres, lencana, dan kasus harian ===== */
.lvs { display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center; text-align: left; padding: 14px 16px; }
.lvb { width: 46px; height: 46px; border-radius: 22.37%; display: grid; place-items: center; font: 800 1.3rem/1 var(--body); color: #fff; background: linear-gradient(180deg, #FFC861, #F08C00 55%, #C96F00); box-shadow: var(--icsh); }
.lvb.big { width: 58px; height: 58px; font-size: 1.6rem; }
.lvt { display: grid; gap: 5px; min-width: 0; }
.lvt b { font-size: 1rem; font-weight: 700; letter-spacing: -.012em; }
.lvt .s { font-size: .82rem; color: var(--fg2); }
.lvf { display: grid; place-items: center; min-width: 44px; padding: 6px 8px; border-radius: 14px; background: var(--sunk); font: 800 1.2rem/1 var(--body); color: var(--muted); }
.lvf small { display: block; font: 600 .62rem/1.4 var(--body); letter-spacing: .04em; text-transform: uppercase; }
.lvf.on { background: color-mix(in srgb, #D63A2F 14%, transparent); color: #C2362B; }
.lvbig { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; padding: 16px; }
.lvbig > div:last-child { display: grid; gap: 6px; min-width: 0; }
.daily { display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center; text-align: left; padding: 14px 16px; }
.daily .dic { width: 46px; height: 46px; border-radius: 22.37%; display: grid; place-items: center; background: linear-gradient(180deg, #7FC2FF, #1565E0 55%, #0E47AB); box-shadow: var(--icsh); }
.daily .dic svg { width: 24px; height: 24px; stroke: #fff; fill: none; stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round; }
.daily.ok .dic { background: linear-gradient(180deg, #7BDCA8, #17A864 55%, #0E7A48); }
.daily b { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 1rem; font-weight: 600; line-height: 1.32; margin-top: 2px; }
.daily .s { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; color: var(--fg2); font-size: .85rem; line-height: 1.4; margin-top: 2px; }
.daily .go { color: var(--muted); font-size: 1.3rem; }
.gstat { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 12px 0 4px; }
.gstat > div { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 6px; text-align: center; display: grid; gap: 2px; }
.gstat b { font: 800 1.3rem/1.1 var(--body); color: var(--accent); }
.gstat span { font-size: .7rem; line-height: 1.25; color: var(--fg2); }
.cal21 { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.cal21 i { aspect-ratio: 1; border-radius: 7px; background: var(--sunk); }
.cal21 i.on { background: linear-gradient(180deg, #7BDCA8, #17A864); }
.cal21 i.now { outline: 2.5px solid var(--accent); outline-offset: 1px; }
.callb { display: flex; justify-content: space-between; margin-top: 8px; font-size: .76rem; color: var(--muted); }
.bdg { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 150px), 1fr)); gap: 10px; }
.bd { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px 12px; display: grid; justify-items: center; gap: 6px; text-align: center; opacity: .5; filter: grayscale(1); }
.bd.on { opacity: 1; filter: none; }
.bd .ic { width: 48px; height: 48px; border-radius: 22.37%; display: grid; place-items: center; background: var(--icg); box-shadow: var(--icsh); }
.bd .ic svg { width: 25px; height: 25px; stroke: #fff; fill: none; stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round; }
.bd b { font-size: .88rem; font-weight: 700; line-height: 1.25; }
.bd span { font-size: .76rem; line-height: 1.35; color: var(--fg2); }
/* ===== simulasi alur laboratorium ===== */
.simbar { display: flex; gap: 5px; margin: 14px 0 10px; }
.simbar i { flex: 1; height: 7px; border-radius: 4px; background: var(--sunk); }
.simbar i.ok { background: linear-gradient(90deg, #7BDCA8, #17A864); }
.simbar i.mid { background: linear-gradient(90deg, #FFD08A, #E8820C); }
.simbar i.no { background: linear-gradient(90deg, #F2A49C, #C2362B); }
.simbar i.cur { background: var(--accent); animation: simPulse 1.5s ease-in-out infinite; }
@keyframes simPulse { 0%, 100% { opacity: 1 } 50% { opacity: .45 } }
.simst { padding: 16px; margin-bottom: 12px; }
.simst.act { border-color: var(--accent); box-shadow: 0 0 0 2.5px color-mix(in srgb, var(--accent) 16%, transparent), var(--shadow); }
.simq { margin: 10px 0 12px; font-weight: 700; font-size: 1.02rem; line-height: 1.45; }
.simimg { margin: 0 0 10px; }
.simimg img { width: 100%; border-radius: 14px; display: block; }
.simimg figcaption { font-size: .8rem; color: var(--muted); margin-top: 6px; line-height: 1.4; }
.simsel { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 4px; }
.simsel .chip.sel[aria-pressed="true"] { background: var(--accent); color: #fff; border-color: var(--accent); }
.simpick { margin: 0 0 10px; font-size: .92rem; line-height: 1.5; color: var(--fg2); }
.simpick b { display: block; font: 600 .7rem/1.3 var(--body); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin-bottom: 3px; }
/* ===== ukur zona hambat ===== */
.zvh { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.zdrop { margin-top: 10px; border: 1.5px dashed var(--line); border-radius: 14px; padding: 14px; text-align: center; font-size: .86rem; color: var(--muted); cursor: pointer; transition: border-color .2s, background .2s; }
.zdrop.on, .zdrop:hover { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 7%, transparent); }
@media (hover: none) { .zdrop { display: none; } }
.zstep { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; background: color-mix(in srgb, var(--accent) 10%, var(--surface)); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; }
.zsn { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: #fff; font: 800 1.05rem/1 var(--body); }
.zstep b { display: block; font-size: 1rem; line-height: 1.3; }
.zstep span { display: block; font-size: .84rem; color: var(--fg2); line-height: 1.4; margin-top: 2px; }
.zsdone { font-weight: 600; line-height: 1.45; }
.zmag { position: absolute; top: 10px; width: 150px; height: 150px; border-radius: 50%; overflow: hidden; border: 3px solid #fff; box-shadow: 0 6px 20px rgba(0, 0, 0, .3); pointer-events: none; }
.zmag canvas { display: block; }
.zfine { display: grid; gap: 8px; margin: 10px 0; justify-items: center; }
.zq { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; border-radius: 14px; padding: 11px 13px; margin: 0 0 10px; font-size: .88rem; line-height: 1.45; }
.zq i { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; font-style: normal; font-weight: 800; font-size: .95rem; }
.zq b { display: block; margin-bottom: 2px; }
.zq em { font-style: normal; display: block; opacity: .88; font-weight: 500; }
.zq.ok { background: var(--ok-bg); color: var(--ok); } .zq.ok i { background: var(--ok); color: var(--ok-bg); }
.zq.warn { background: var(--warn-bg); color: var(--warn); } .zq.warn i { background: var(--warn); color: var(--warn-bg); }
.zq.bad { background: var(--bad-bg); color: var(--bad); } .zq.bad i { background: var(--bad); color: var(--bad-bg); }
#zcn span { font: 600 .85rem/1.3 inherit; color: var(--fg2); }
.zfine span { font: 800 1.05rem var(--mono); color: var(--accent); }

/* page transitions (View Transitions API) */

html[data-nav="push"]::view-transition-old(root) { animation-name: pushOut; }
html[data-nav="pop"]::view-transition-old(root) { animation-name: popOut; z-index: 2; }
html[data-nav="pop"]::view-transition-new(root) { animation-name: popIn; }
html[data-nav="open"]::view-transition-new(root) { animation: bookIn .68s cubic-bezier(.33, .9, .18, 1) both; transform-origin: left center; z-index: 2; }
html[data-nav="open"]::view-transition-old(root) { animation: bookUnder .68s cubic-bezier(.33, .9, .18, 1) both; transform-origin: center; }
html[data-nav="close"]::view-transition-old(root) { animation: bookOut .58s cubic-bezier(.45, .05, .3, 1) both; transform-origin: left center; z-index: 2; }
html[data-nav="close"]::view-transition-new(root) { animation: bookBack .58s cubic-bezier(.45, .05, .3, 1) both; transform-origin: center; }
html[data-nav="tab"]::view-transition-old(root) { animation: fadeOut .18s ease-out both; }

#buddy { position: fixed; z-index: 72; width: 68px; height: 68px; cursor: grab; touch-action: none; -webkit-tap-highlight-color: transparent; filter: drop-shadow(0 8px 18px rgba(18, 88, 214, .3)); transition: transform .32s var(--ease), opacity .32s var(--ease); }

#buddy:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; border-radius: 50%; }
#buddy .bsvg { width: 100%; height: 100%; display: block; overflow: visible; animation: bFloat 3.4s ease-in-out infinite; }
#buddy .bdot { position: absolute; right: 3px; top: 5px; width: 13px; height: 13px; border-radius: 50%; background: #34D399; border: 2.5px solid var(--bg); animation: bPing 2.6s ease-in-out infinite; }
#buddy .bshadow { fill: rgba(16, 38, 74, .16); animation: bShadow 3.4s ease-in-out infinite; }
#buddy .bcilia path { fill: none; stroke: #2F8FF0; stroke-width: 5; stroke-linecap: round; transform-origin: 60px 58px; animation: bWiggle 1.9s ease-in-out infinite; }
#buddy .bcilia path:nth-child(2n) { animation-delay: -.5s; } #buddy .bcilia path:nth-child(3n) { animation-delay: -1s; }
#buddy .bbody { transform-origin: 60px 80px; animation: bSquash 3.4s ease-in-out infinite; }
#buddy.blink .bjoy { opacity: 1; }
#buddy.blink .beyes { opacity: 0; }
#buddy .bpup { transform-origin: 60px 56px; animation: bLook 6.5s ease-in-out infinite; }
#buddy .bmouth { fill: none; stroke: #10264A; stroke-width: 3.4; stroke-linecap: round; }
#buddy.hop { animation: bHop .72s cubic-bezier(.3, 1.3, .5, 1); }
#buddy.peek { animation: bPeek .7s cubic-bezier(.3, 1.3, .5, 1); }
#buddy.spin { animation: bSpin .9s cubic-bezier(.3, 1.2, .4, 1); }
@keyframes bFloat { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(-7px) } }
@keyframes bShadow { 0%, 100% { opacity: 1; transform: scaleX(1) } 50% { opacity: .55; transform: scaleX(.8) } }
@keyframes bSquash { 0%, 100% { transform: scale(1, 1) } 42% { transform: scale(1.04, .96) } 70% { transform: scale(.97, 1.03) } }
@keyframes bWiggle { 0%, 100% { transform: rotate(-7deg) } 50% { transform: rotate(7deg) } }
@keyframes bLook { 0%, 58%, 100% { transform: translate(0, 0) } 66% { transform: translate(-3.5px, 1px) } 82% { transform: translate(3.5px, 1px) } }
@keyframes bPing { 0%, 100% { box-shadow: 0 0 0 0 rgba(52, 211, 153, .55) } 70% { box-shadow: 0 0 0 9px rgba(52, 211, 153, 0) } }
@keyframes bHop { 0% { transform: translateY(0) scale(1, 1) } 22% { transform: translateY(2px) scale(1.14, .86) } 52% { transform: translateY(-26px) scale(.9, 1.12) } 78% { transform: translateY(1px) scale(1.1, .9) } 100% { transform: translateY(0) scale(1, 1) } }
@keyframes bPeek { 0% { transform: scale(1.1) } 45% { transform: scale(.86) rotate(-9deg) } 100% { transform: scale(1) rotate(0) } }
@keyframes bSpin { 0% { transform: rotate(0) scale(1) } 50% { transform: rotate(190deg) scale(1.16) } 100% { transform: rotate(360deg) scale(1) } }

:root {
  --bg: #EEF6FF; --surface: #FFFFFF; --sunk: #E3EFFC; --line: #D5E4F6; --sep: rgba(21, 101, 224, .18);
  --fg: #0F2140; --fg2: #2B3E5F; --muted: #5A6B85;
  --accent: #1565E0; --accent-fg: #FFFFFF; --sky: #38BDF8; --sky-d: #0B7FB8;
  --grad: linear-gradient(135deg, #1258D6 0%, #2F8FF0 55%, #5CCBF7 100%);
  --grad-soft: linear-gradient(135deg, #E3F0FF 0%, #E6F7FF 100%);
  --mat: color-mix(in srgb, #EEF6FF 80%, transparent);
  --shadow: 0 1px 1px rgba(15, 50, 120, .04), 0 8px 22px rgba(21, 101, 224, .08);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #06122A; --surface: #0F1F3F; --sunk: #172B50; --line: #233B64; --sep: rgba(120, 180, 255, .22);
  --fg: #EAF3FF; --fg2: #C7D8F2; --muted: #93A8C9; --accent: #5CB8FF; --accent-fg: #04122B; --sky: #38BDF8; --sky-d: #7DD3FC;
  --grad: linear-gradient(135deg, #1A5FD8 0%, #2C8BEA 55%, #3FB6EE 100%); --grad-soft: linear-gradient(135deg, #10274D, #0E2E4F);

  const SIMP = st.get('simp', {});
  const simSave = () => st.set('simp', SIMP);
  function simList() {
    chrome({ k: 'Latihan', t: 'Simulasi alur laboratorium', back: true, tab: 'lain' });
    V.innerHTML = `<h1 class="h1">Simulasi alur laboratorium</h1><p class="lead">Jalankan satu spesimen dari penerimaan sampai pelaporan. Setiap keputusan Anda dinilai, termasuk pemilihan media dan uji lanjutan, sehingga ketepatan dan efisiensi sama-sama terukur.</p>
      <div class="list">${SIMS.map((s) => { const p = SIMP[s.id]; const sc = p && p.fin ? ` · nilai terbaik ${p.best}%` : ''; return item({ v: 'simrun', id: s.id }, s.k, ICON.dish, esc(s.t), `${esc(s.sub)} · ${s.st.length} tahap · ${s.lvl}${sc}`); }).join('')}</div>
      <div class="card" style="padding:16px;margin-top:14px"><div class="eyebrow">Cara penilaian</div><ul class="m5ol">
        <li>Setiap tahap punya bobot nilai sendiri, dengan total 140 poin.</li>
        <li>Pada tahap media dan uji lanjutan, memilih yang tidak perlu mengurangi nilai. Inilah yang melatih efisiensi pemeriksaan.</li>
        <li>Pembahasan muncul setelah setiap jawaban, baik benar maupun salah.</li>
        <li>Simulasi ini alat belajar. Keputusan laboratorium yang sebenarnya mengikuti SOP dan edisi CLSI yang berlaku di tempat Anda.</li></ul></div>`;
    bind();
  }
  function simRun(id) {
    const S = SIMS.find((x) => x.id === id) || SIMS[0];
    chrome({ k: 'Simulasi', t: S.t, back: true, tab: 'lain' });
    const P = SIMP[S.id] = SIMP[S.id] || { i: 0, ans: {}, sc: 0, best: 0, fin: 0 };
    const total = S.st.reduce((a, x) => a + x.pts, 0);
    const draw = () => {
      let h = `<h1 class="h1" style="font-size:1.5rem">${esc(S.t)}</h1><p class="lead small"><i>${esc(S.sub)}</i></p>
        <div class="card" style="padding:16px"><div class="eyebrow">Data pasien</div><ul class="m5ol">${S.pt.map((x) => `<li>${esc(x)}</li>`).join('')}</ul></div>
        <div class="simbar">${S.st.map((x, i) => `<i class="${P.ans[i] ? (P.ans[i].p >= x.pts * 0.75 ? 'ok' : P.ans[i].p > 0 ? 'mid' : 'no') : i === P.i ? 'cur' : ''}" title="${esc(x.k)}"></i>`).join('')}</div>`;
      S.st.forEach((x, i) => {
        if (i > P.i) return;
        const a = P.ans[i], act = i === P.i && !a;
        h += `<div class="card simst${act ? ' act' : ''}" id="s${i}"><div class="eyebrow">Tahap ${i + 1} dari ${S.st.length} · ${esc(x.k)}${a ? ` · ${a.p} dari ${x.pts} poin` : ''}</div>`;
        if (!a && x.img) h += `<figure class="simimg"><img src="media/${x.img}" alt="${esc(x.cap || '')}" loading="lazy"><figcaption>${esc(x.cap || '')}</figcaption></figure>`;
        if (!a && x.info) h += `<ul class="m5ol">${x.info.map((y) => `<li>${y}</li>`).join('')}</ul>`;
        if (!a && x.tab) h += `<div class="bpw"><table class="bpt crt"><thead><tr>${x.tab.h.map((y) => `<th>${y}</th>`).join('')}</tr></thead><tbody>${x.tab.r.map((r) => `<tr>${r.map((c, j) => (j === 0 ? `<th>${c}</th>` : `<td>${c}</td>`)).join('')}</tr>`).join('')}</tbody></table></div>`;
        h += `<p class="simq">${x.q}</p>`;
        if (a) { h += `<p class="simpick"><b>Pilihan Anda</b> ${a.txt}</p><div class="fb ${a.p >= x.pts * 0.75 ? 'ok' : 'no'}"><b>${a.p >= x.pts * 0.75 ? 'Tepat.' : a.p > 0 ? 'Sebagian tepat.' : 'Belum tepat.'}</b><p>${a.fb}</p></div>`; }
        else if (x.type === 'one') h += `<div class="opts">${x.o.map((o, j) => `<button class="opt" data-one="${j}"><span class="L">${'ABCD'[j]}</span><span>${o[0]}</span></button>`).join('')}</div>`;
        else if (x.type === 'multi' || x.type === 'tests') {
          const lab = x.type === 'multi' ? SMED : STEST;
          h += `<div class="simsel">${x.items.map((k) => `<button class="chip sel" data-pick="${k}">${esc(lab[k])}</button>`).join('')}</div>
            <div class="navrow"><button class="btn pri block" id="run">${x.type === 'multi' ? 'Tanam media yang dipilih' : 'Jalankan uji yang dipilih'}</button></div>`;
        }
        h += '</div>';
      });
      if (P.fin) {
        const pct = Math.round((P.sc / total) * 100);
        h += `<div class="card endcard" style="--mc:${S.k}"><div class="eyebrow">Hasil simulasi</div><div class="h1" style="font-size:2.4rem;margin:0">${pct}%</div><b class="mt">${P.sc} dari ${total} poin</b>
          <p class="lead" style="margin:0">${pct >= 85 ? 'Alur kerja Anda tepat dan efisien.' : pct >= 65 ? 'Alur kerjanya sudah benar, masih ada langkah yang dapat dihemat.' : 'Baca kembali pembahasan tiap tahap, lalu ulangi simulasinya.'}</p></div>
          <div class="navrow"><button class="btn" ${G({ v: 'sim' })}>Simulasi lain</button><button class="btn pri" id="again">Ulangi simulasi ini</button></div>`;
      }
      V.innerHTML = h; bind(); bindTables();
      const x = S.st[P.i];
      if (!P.fin && x && !P.ans[P.i]) {
        $$('[data-one]').forEach((b) => (b.onclick = () => {
          const j = +b.dataset.one, o = x.o[j], p = o[1] ? x.pts : 0;
          P.ans[P.i] = { p, txt: strip(o[0]), fb: o[2] }; P.sc += p; HP(o[1] ? 'ok' : 'no'); next();
        }));
        const picked = new Set();
        $$('[data-pick]').forEach((b) => (b.onclick = () => { const k = b.dataset.pick; if (picked.has(k)) { picked.delete(k); b.setAttribute('aria-pressed', 'false'); } else { picked.add(k); b.setAttribute('aria-pressed', 'true'); } }));
        const run = $('#run');
        if (run) run.onclick = () => {
          const sel = [...picked];
          if (!sel.length) { toast('Pilih dulu minimal satu'); return; }
          const lab = x.type === 'multi' ? SMED : STEST;
          let p, fb;
          if (x.type === 'multi') {
            const hit = x.need.filter((k) => sel.includes(k)).length;
            const extra = sel.filter((k) => !x.need.includes(k) && !(x.acc || []).includes(k)).length;
            p = Math.max(0, Math.round(x.pts * (hit / x.need.length)) - extra * 4);
            fb = `${x.fb} Anda memilih ${sel.map((k) => lab[k]).join(', ')}.${hit < x.need.length ? ` Media yang terlewat: ${x.need.filter((k) => !sel.includes(k)).map((k) => lab[k]).join(', ')}.` : ''}${extra ? ` Media yang tidak diperlukan: ${extra}.` : ''}`;
          } else {
            const hit = x.must.filter((k) => sel.includes(k)).length;
            const bad = sel.filter((k) => (x.useless || []).includes(k)).length;
            p = Math.max(0, Math.round(x.pts * (hit / x.must.length)) - bad * 4);
            fb = `<b>Hasil uji</b><br>${sel.map((k) => `${lab[k]}: ${x.res[k] || 'tidak dapat dinilai'}`).join('<br>')}<br><br>${x.fb}${hit < x.must.length ? ` Uji penting yang terlewat: ${x.must.filter((k) => !sel.includes(k)).map((k) => lab[k]).join(', ')}.` : ''}${bad ? ` Uji yang tidak memberi informasi: ${bad}.` : ''}`;
          }
          P.ans[P.i] = { p, txt: sel.map((k) => lab[k]).join(', '), fb }; P.sc += p; HP(p >= x.pts * 0.75 ? 'ok' : 'no'); next();

    const setT = (t, demo) => { WSM.txt = t; ABM.txt = t; ABM.demo = !!demo; ta.value = t; WSM.syn = null; WSM.wd = 'all'; WSM.regs = null; WSM.auto = true; };
    ta.oninput = () => { WSM.txt = ta.value; ABM.txt = ta.value; ABM.demo = false; clearTimeout(tm); tm = setTimeout(() => { WSM.syn = null; WSM.regs = null; WSM.auto = true; wscRun(); }, 400); };
    $('#wsf').onchange = (e) => { const f = e.target.files[0]; if (!f) return; if (f.size > 8e6) { toast('Berkas terlalu besar (maksimum 8 MB).'); return; } const rd = new FileReader(); rd.onload = () => { setT(String(rd.result || ''), false); wscRun(); }; rd.readAsText(f); e.target.value = ''; };
    $('#wsx').onclick = () => { setT(ABGC.demo(3, true), true); wscRun(); setTimeout(() => { const r = $('#wsr .wsh'); if (r) r.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 800); };
    $('#wsc0').onclick = () => { setT('', false); wscRun(); };
    $('#wstp').onclick = () => abCopy(WSTPL);
    $('#wsgo').onclick = (e) => { e.preventDefault(); ta.scrollIntoView({ behavior: 'smooth', block: 'center' }); ta.focus(); };
    wscRun();
  }

  function wscRun() {
    if (!WSM.txt.trim()) { WSM.P = null; $('#wso').innerHTML = `<div class="card abc"><div class="eyebrow">Belum ada data</div><p style="margin:6px 0 0;font-size:.95rem;line-height:1.55">Tempel data pada kotak di atas, atau tekan <b>Lihat contoh hasil</b> untuk mencoba dengan data rekaan. Setelah data masuk, Anda tinggal memilih jenis infeksi (langkah 2) dan obat yang dibandingkan (langkah 3).</p></div>`; return; }
    const P = ABGC.parse(WSM.txt); WSM.P = P;
    if (!P.ok) { $('#wso').innerHTML = (P.priv && P.priv.length ? out('alert', 'Kolom identitas diabaikan', `Kolom ${P.priv.map(esc).join(', ')} tampak berisi identitas pasien dan tidak dipakai. Ganti dengan kode anonim.`) : '') + out('warn', 'Data belum dapat dibaca', P.err); return; }
    wscBuild();
  }

  // Menyusun strata sindrom dari data
  function wscStrata(P, rows) {
    const m = new Map(); let derived = false;
    if (P.idx.syn >= 0) {
      rows.forEach((r) => { const s = (r.sy || '').trim(); if (!s) return; const k = s.toLowerCase().replace(/\s+/g, ' '); if (!m.has(k)) m.set(k, { k, lab: s, rows: [] }); m.get(k).rows.push(r); });
    } else if (P.idx.spec >= 0) {
      derived = true;
      rows.forEach((r) => { if (!wsSD[r.sp]) return; if (!m.has(r.sp)) m.set(r.sp, { k: r.sp, lab: wsSD[r.sp], rows: [] }); m.get(r.sp).rows.push(r); });
    } else {
      m.set('all', { k: 'all', lab: 'Semua isolat (sindrom tidak diketahui)', rows: rows.slice() });
    }
    return { list: [...m.values()].sort((a, b) => b.rows.length - a.rows.length), derived };
  }

  function wscBuild() {
    const P = WSM.P, O = WSM.o;
    let rows = P.rows.slice(), fi = null;
    if (O.first && P.idx.id < 0) O.first = false;
    if (O.first) { fi = ABGC.firstIso(P); rows = fi.rows; }
    if (WSM.wd !== 'all' && P.idx.ward >= 0) rows = rows.filter((r) => r.wd === WSM.wd);
    const S = wscStrata(P, rows); WSM.S = S; WSM.fi = fi; WSM.rowsAll = rows;
    if (!S.list.length) { $('#wso').innerHTML = out('warn', 'Sindrom tidak ditemukan', 'Kolom Sindrom kosong atau jenis spesimen tidak dikenali. Isi kolom Sindrom, atau pastikan kolom Spesimen berisi darah, urin, sputum, atau luka.'); return; }
    if (!S.list.some((x) => x.k === WSM.syn)) WSM.syn = S.list[0].k;
    const cur = S.list.find((x) => x.k === WSM.syn);
    const test = (a) => cur.rows.filter((r) => r.res[a]).length;
    const avail = P.abx.filter((a) => test(a) >= Math.max(10, 0.3 * cur.rows.length)).sort((a, b) => ABGC.AI[a] - ABGC.AI[b]);
    WSM.avail = avail;
    if (WSM.auto || !WSM.regs) {
      const isk = /isk|kemih|urin|uti/i.test(cur.lab);
      const pref = ['CRO', 'CTX', 'AMK', 'GEN', 'MEM', 'TZP', 'CIP', 'SXT', 'NIT', 'AMC', 'SAM', 'FEP', 'CAZ'], ok = avail.filter((a) => isk || !ABGC.URINE_ONLY.includes(a));
      WSM.regs = [...pref.filter((a) => ok.includes(a)), ...ok.filter((a) => !pref.includes(a)).sort((a, b) => test(b) - test(a))].slice(0, 6).sort((a, b) => ABGC.AI[a] - ABGC.AI[b]).map((a) => [a]);
    }
    WSM.regs = WSM.regs.filter((r) => r.every((a) => P.abx.includes(a)));
    const chips = S.list.map((x) => `<button type="button" class="chip" data-s="${esc(x.k)}" aria-pressed="${x.k === WSM.syn}">${esc(x.lab)} <small>${x.rows.length} isolat</small></button>`).join('');
    const wards = P.idx.ward >= 0 ? `<div class="eyebrow sub">Batasi menurut ruang rawat (opsional)</div><div class="abch" id="wsw">${['all', 'RI', 'RNI', 'EMR', 'RJ'].map((k) => `<button type="button" class="chip" data-w="${k}" aria-pressed="${WSM.wd === k}">${k === 'all' ? 'Semua' : ABGC.WARD_N[k]}</button>`).join('')}</div>` : '';
    $('#wso').innerHTML = `${ABM.demo ? '<div class="wsdemo"><b>Data rekaan.</b> Angka di bawah berasal dari data sintetis untuk latihan, bukan dari rumah sakit mana pun.</div>' : ''}
      <div class="card abc"><div class="eyebrow">Langkah 2 · Pilih jenis infeksi</div>
        <p class="mu small" style="margin:6px 0 8px">${S.derived ? 'Berkas Anda tidak memiliki kolom Sindrom, sehingga jenis infeksi diturunkan dari spesimen. Cara ini kasar: isolat sputum dan luka bisa hanya kolonisasi.' : 'Tiap jenis infeksi punya kuman berbeda, jadi dihitung sendiri-sendiri. Ketuk satu.'}</p>
        <div class="abch" id="wss">${chips}</div>${wards}
        <details class="fold" style="margin-top:10px"><summary>Pengaturan lanjutan (umumnya tidak perlu diubah)</summary><div>
          <label class="wsck"><input type="checkbox" id="wsfi" ${O.first ? 'checked' : ''} ${P.idx.id < 0 ? 'disabled' : ''}> <span><b>Satu hasil per pasien.</b> Bila pasien yang sama dikultur berulang, hanya kultur pertama per jenis kuman yang dihitung (standar CLSI M39). ${P.idx.id < 0 ? 'Tidak tersedia karena kolom ID tidak ada.' : ''}</span></label>
          <label class="wsck"><input type="checkbox" id="wsci" ${O.countI ? 'checked' : ''}> <span><b>Anggap hasil intermediet (I, SDD) sebagai sensitif.</b> Bila tidak dicentang, hanya hasil S yang dianggap sensitif.</span></label>
          <label class="wsck"><span style="min-width:0"><b>Jumlah jenis kuman yang dihitung:</b> <select id="wsk" class="wssel" aria-label="Jumlah jenis kuman">${[5, 8, 10, 15].map((n) => `<option value="${n}" ${O.topK === n ? 'selected' : ''}>${n} terbanyak</option>`).join('')}</select></span></label></div></details></div>
      <div class="card abc"><div class="eyebrow">Langkah 3 · Pilih obat yang ingin dibandingkan</div>
        <p class="mu small" style="margin:6px 0 8px">Ketuk obat untuk menambah atau melepasnya (maksimum 12). Awalnya alat memilihkan obat yang lazim dipakai.</p>
        <div class="abch" id="wsdr" role="group">${avail.map((a) => `<button type="button" class="chip" data-a="${a}" aria-pressed="false">${esc(wsN(a))}</button>`).join('')}</div>
        <details class="fold" id="wscb" style="margin-top:10px"><summary>Bandingkan kombinasi dua obat (opsional)</summary><div>
          <p class="mu small" style="margin:0 0 8px">Pada kombinasi, kuman dianggap sensitif bila sensitif terhadap salah satu dari kedua obat.</p>
          <div class="abch" id="wsrg"></div>
          <div class="wsb"><select id="wsa1" class="wssel" aria-label="Obat pertama">${avail.map((a) => `<option value="${a}">${esc(wsN(a))}</option>`).join('')}</select><span aria-hidden="true">+</span><select id="wsa2" class="wssel" aria-label="Obat kedua">${avail.map((a, i) => `<option value="${a}" ${i === 1 ? 'selected' : ''}>${esc(wsN(a))}</option>`).join('')}</select><button type="button" class="chip" id="wsadd">Tambah kombinasi</button></div></div></details>
        <div class="m5act"><button type="button" class="chip" id="wsall">Pilih semua obat</button><button type="button" class="chip" id="wsclr">Kosongkan</button><button type="button" class="chip" id="wsrst">Kembali ke pilihan awal</button></div></div>
      <div id="wsr" style="display:grid;gap:12px;grid-template-columns:minmax(0,1fr)"></div>`;
    $$('#wss button').forEach((b) => (b.onclick = () => { WSM.syn = b.dataset.s; WSM.auto = true; wscBuild(); }));
    $$('#wsw button').forEach((b) => (b.onclick = () => { WSM.wd = b.dataset.w; WSM.auto = true; wscBuild(); }));
    $('#wsfi').onchange = (e) => { O.first = e.target.checked; wsSave(); WSM.auto = true; wscBuild(); };
    $('#wsci').onchange = (e) => { O.countI = e.target.checked; wsSave(); wscCalc(); };
    $('#wsk').onchange = (e) => { O.topK = Number(e.target.value); wsSave(); wscCalc(); };
    $('#wsadd').onclick = () => {
      const a = $('#wsa1').value, b = $('#wsa2').value; if (!a) return;
      if (a === b) { toast('Pilih dua obat yang berbeda.'); return; }
      const r = b ? [a, b].sort((x, y) => ABGC.AI[x] - ABGC.AI[y]) : [a];
      if (WSM.regs.some((x) => x.join() === r.join())) { toast('Kombinasi itu sudah ada.'); return; }
      if (WSM.regs.length >= 12) { toast('Maksimum 12 pilihan sekaligus.'); return; }
      WSM.auto = false; WSM.regs.push(r); wscCalc();
    };
    $('#wsall').onclick = () => { WSM.auto = false; WSM.regs = WSM.avail.slice(0, 12).map((a) => [a]); if (WSM.avail.length > 12) toast('Dibatasi 12 obat pertama.'); wscCalc(); };
    $('#wsclr').onclick = () => { WSM.auto = false; WSM.regs = []; wscCalc(); };
    $('#wsrst').onclick = () => { WSM.auto = true; wscBuild(); };
    wscCalc();
  }

  function wscChips() {
    const el = $('#wsrg'), dr = $('#wsdr'); if (!el) return;
    const sel = new Set(WSM.regs.filter((r) => r.length === 1).map((r) => r[0]));
    if (dr) $$('#wsdr button').forEach((b) => b.setAttribute('aria-pressed', String(sel.has(b.dataset.a))));
    const cb = WSM.regs.map((r, i) => [r, i]).filter(([r]) => r.length > 1);
    el.innerHTML = cb.length ? cb.map(([r, i]) => `<span class="chip wsrc">${esc(wsRL(r))}<button type="button" data-i="${i}" aria-label="Hapus ${esc(wsRL(r))}">×</button></span>`).join('') : '<span class="mu small">Belum ada kombinasi.</span>';
    if (cb.length) { const w = $('#wscb'); if (w) w.open = true; }
    $$('#wsrg button').forEach((b) => (b.onclick = () => { WSM.auto = false; WSM.regs.splice(Number(b.dataset.i), 1); wscCalc(); }));
    $$('#wsdr button').forEach((b) => (b.onclick = () => {
      const a = b.dataset.a, k = WSM.regs.findIndex((r) => r.length === 1 && r[0] === a); WSM.auto = false;
      if (k >= 0) WSM.regs.splice(k, 1); else { if (WSM.regs.length >= 12) { toast('Maksimum 12 pilihan sekaligus.'); return; } WSM.regs.push([a]); WSM.regs.sort((x, y) => ABGC.AI[x[0]] - ABGC.AI[y[0]] || x.length - y.length); }
      wscCalc();
    }));
  }

  function wscCalc() {
    wscChips();
    const box = $('#wsr'); if (!box) return;
    const cur = WSM.S.list.find((x) => x.k === WSM.syn), O = WSM.o;
    if (!WSM.regs.length) { box.innerHTML = out('idle', 'Pilih obat', 'Ketuk minimal satu obat pada langkah 3 untuk melihat hasilnya.'); return; }
    box.innerHTML = '<div class="card abc"><p class="mu" style="margin:0">Menghitung…</p></div>';
    setTimeout(() => {
      let W;
      try { W = ABGC.wisca(cur.rows, WSM.regs, { sims: 4000, countI: O.countI, topK: O.topK }); } catch (e) { box.innerHTML = out('warn', 'Perhitungan gagal', esc(String(e.message || e))); return; }
      WSM.res = W; wscShow(W, cur);
    }, 20);
  }

  function wscShow(W, cur) {
    const O = WSM.o, P = WSM.P, box = $('#wsr');
    const R = W.regs.slice().sort((a, b) => b.mean - a.mean), top = R[0];
    const tie = R.slice(1).filter((r) => r.hi >= top.lo && r.lo <= top.hi && r.mean < top.mean);
    const cov = (100 * W.nInc) / W.nAll;
    const lowN = W.nInc < 100;
    const head = `<p class="wsh">Pada <b>${esc(cur.lab)}</b>, <b>${esc(wsRL(top.agents))}</b> paling sering sensitif: sekitar <b>${Math.round(top.mean)} dari 100 pasien</b> (kisaran yang masuk akal ${Math.round(top.lo)} sampai ${Math.round(top.hi)} dari 100).</p>
      <p class="wsh2">${R.length > 1 ? (tie.length ? `Selisihnya dengan <b>${tie.map((r) => esc(wsRL(r.agents))).join(', ')}</b> terlalu kecil untuk dipastikan karena kisarannya saling tumpang tindih. ` : 'Selisihnya dengan pilihan lain cukup jelas. ') : ''}Dihitung dari ${W.nInc} hasil kultur (${W.species.length} jenis kuman).${lowN ? ' <b>Datanya sedikit, anggap hasil ini indikatif.</b>' : ''}</p>
      <p class="wsh2 mu">Angka tertinggi belum tentu pilihan terbaik: obat yang lebih sempit dengan angka yang cukup tinggi biasanya lebih diutamakan, dan angka ini hanya menyatakan kuman sensitif, bukan kesembuhan pasien.</p>`;
    const ax = `<div class="wsrow wsax"><span></span><div class="wst"><b style="left:0">0</b><b style="left:25%">25</b><b style="left:50%">50</b><b style="left:75%">75</b><b style="left:100%">100%</b></div><span></span></div>`;
    const forest = R.map((r) => `<div class="wsrow"><div class="nm"><b>${esc(wsRL(r.agents))}</b></div><div class="wst" role="img" aria-label="${esc(wsRL(r.agents))}: ${wsF(r.mean)} persen, interval ${wsF(r.lo)} sampai ${wsF(r.hi)}"><i class="gl" style="left:25%"></i><i class="gl" style="left:50%"></i><i class="gl" style="left:75%"></i><u class="${r === top ? 'tp' : ''}" style="left:${r.lo}%;width:${Math.max(0.6, r.hi - r.lo)}%"></u><s class="${r === top ? 'tp' : ''}" style="left:${r.mean}%"></s></div><div class="wsv">${wsF(r.mean)}%</div></div>`).join('');
    const tbl = `<div class="bpw"><table class="bpt wstb"><thead><tr><th>Obat</th><th>Perkiraan</th><th>Kisaran 95%</th><th>Terbaik</th></tr></thead><tbody>${R.map((r) => `<tr><th scope="row">${esc(wsRL(r.agents))}</th><td><b>${wsF(r.mean)}%</b></td><td>${wsF(r.lo)}–${wsF(r.hi)}</td><td>${Math.round(r.pBest * 100)}%</td></tr>`).join('')}</tbody></table></div>`;
    const sp = W.species.map((s) => `<div class="abrow"><div class="nm"><b><i>${esc(s.lab)}</i></b><small>n ${s.n}</small></div><div class="abbar q3"><i style="width:${(100 * s.n) / W.nInc}%"></i></div><div class="abpct q3">${Math.round((100 * s.n) / W.nInc)}%</div></div>`).join('');
    const mt = `<div class="bpw"><table class="bpt abt wsmx"><thead><tr><th>Spesies</th><th>Porsi</th>${R.map((r) => `<th>${esc(wsRL(r.agents))}</th>`).join('')}</tr></thead><tbody>${W.species.map((s, i) => `<tr><th scope="row"><i>${esc(s.lab)}</i></th><td>${Math.round((100 * s.n) / W.nInc)}%</td>${R.map((r) => { const q = r.per.find((x) => x.k === s.k); const p = q.theta * 100; return `<td class="${q.N === 0 ? 'na' : q.ri ? 'ri' : hc(p)}" title="${esc(s.lab)}: ${q.N === 0 ? 'tidak ada data' : q.ri ? 'resistensi intrinsik' : Math.round(p) + '% sensitif (' + q.S + ' dari ' + q.N + ' isolat)'}">${q.N === 0 ? '–' : q.ri ? 'RI' : `<b>${Math.round(p)}</b><small>${q.S}/${q.N}</small>`}</td>`; }).join('')}</tr>`).join('')}</tbody></table></div>`;
    const wn = [];
    if (lowN) wn.push(['wk', `<b>Data sedikit.</b> Hanya ${W.nInc} isolat dimodelkan; di bawah sekitar 100 isolat intervalnya lebar dan peringkat regimen mudah berubah. Anggap hasil ini indikatif.`]);
    if (W.nSp > W.species.length) wn.push(['wk', `<b>Spesies lain diabaikan.</b> Model memakai ${W.species.length} spesies terbanyak yang mencakup ${cov.toFixed(0)}% dari ${W.nAll} isolat sindrom ini. ${W.nSp - W.species.length} spesies lain tidak ikut dihitung, sehingga persentase sensitif sebenarnya bisa lebih rendah.`]);
    if (WSM.S.derived) wn.push(['wk', `<b>Sindrom diturunkan dari spesimen.</b> Isolat sputum dan luka dapat berasal dari kolonisasi. Tambahkan kolom Sindrom dari diagnosis klinis agar hasilnya lebih tepat.`]);
    if (P.idx.id < 0) wn.push(['wk', `<b>Kolom ID tidak ada.</b> Isolat berulang dari pasien yang sama ikut terhitung dan dapat membuat kepekaan tampak lebih rendah.`]);
    else if (WSM.fi && WSM.fi.noid) wn.push(['wk', `<b>${WSM.fi.noid} baris tanpa ID</b> dipertahankan apa adanya sehingga duplikasi tidak dapat disaring.`]);
    const sd = [...new Set(W.warn.filter((w) => w.t === 'nodata').map((w) => w.sp))];
    if (sd.length) wn.push(['wk', `<b>Tidak ada hasil uji</b> untuk sebagian regimen pada: ${sd.map((x) => `<i>${esc(x)}</i>`).join(', ')}. Spesies itu dinilai hanya dari prior sehingga persentase pekanya sangat tidak pasti.`]);
    const nf = W.regs.filter((r) => r.agents.some((a) => ABGC.URINE_ONLY.includes(a)));
    if (nf.length && !/isk|kemih|urin|uti/i.test(cur.lab)) wn.push(['wk', `<b>Nitrofurantoin dan fosfomisin</b> hanya bermakna untuk infeksi saluran kemih bawah. Pada sindrom ini angkanya tidak boleh dipakai untuk memilih terapi.`]);
    wn.push(['wk', `<b>Bias seleksi.</b> Kultur biasanya diambil dari pasien yang sakit lebih berat atau gagal terapi awal, sehingga resistensi cenderung tampak lebih tinggi daripada populasi pasien yang tidak dikultur.`]);
    const wl = `<ul class="abck">${wn.map(([c, t]) => `<li class="${c}"><span>${c === 'wk' ? '!' : '✓'}</span><span>${t}</span></li>`).join('')}</ul>`;
    const meth = `Persentase kuman sensitif pada terapi empiris dihitung dengan metode WISCA (Weighted-Incidence Syndromic Combination Antibiogram) pada ${cur.lab} (${W.nInc} isolat dari ${W.species.length} spesies${O.first ? ', isolat pertama per pasien per spesies' : ''}). Proporsi spesies dimodelkan dengan distribusi Dirichlet dan kepekaan tiap spesies dengan distribusi Beta (prior Jeffreys 0,5; 0,5), disimulasikan 4.000 kali. Hasil dilaporkan sebagai rerata dan interval kredibel 95%.${O.countI ? ' Hasil I dan SDD dihitung sebagai sensitif.' : ' Hanya hasil S yang dihitung sebagai sensitif.'}`;
    const tsv = 'Regimen\tPersen sensitif (%)\tInterval 95% bawah\tInterval 95% atas\tPeluang terbaik (%)\n' + R.map((r) => [wsRL(r.agents), wsF(r.mean), wsF(r.lo), wsF(r.hi), Math.round(r.pBest * 100)].join('\t')).join('\n');
    box.innerHTML = `<div class="card abc"><div class="eyebrow">Hasil · ${esc(cur.lab)}</div>${head}</div>
      <div class="card abc"><div class="eyebrow">Persentase pasien yang kumannya sensitif</div>
        <p class="mu small" style="margin:4px 0 8px"><b>Titik</b> adalah perkiraan. <b>Garis</b> adalah kisaran yang masuk akal (interval kredibel 95%): makin pendek garisnya, makin pasti angkanya. Data yang sedikit membuat garis panjang.</p>
        <div class="wsplot">${forest}${ax}</div>
        <details class="fold"><summary>Lihat angka lengkap</summary><div>${tbl}
        <p class="abnote"><b>Terbaik</b> adalah peluang suatu pilihan benar-benar yang tertinggi di antara yang dibandingkan. Bila beberapa pilihan angkanya berdekatan, peluangnya terbagi, dan itu tanda perbedaannya belum jelas.</p></div></details></div>
      <div class="card abc"><div class="eyebrow">Mengapa angkanya begitu</div>
        <p class="mu small" style="margin:4px 0 8px"><b>Porsi kuman</b> pada infeksi ini (langkah 1 pada penjelasan di atas):</p>${sp}
        <p class="mu small" style="margin:14px 0 6px"><b>Persen tiap kuman yang sensitif</b> terhadap tiap obat (langkah 2). Angka kecil: jumlah sensitif dari jumlah diuji. RI: resisten secara alami, dihitung nol.</p>${mt}</div>
      <div class="card abc"><div class="eyebrow">Hal yang perlu diperhatikan</div>${wl}</div>
      <div class="card abc"><div class="eyebrow">Salin untuk naskah</div><div class="m5act" style="margin-top:8px"><button type="button" class="chip" id="wscp1">Salin tabel</button><button type="button" class="chip" id="wscp2">Salin kalimat metode</button></div>
        <p class="mu small" style="margin:10px 0 0">Simulasi memakai seed tetap sehingga hasil yang sama selalu muncul dari data dan pengaturan yang sama.</p></div>
      <details class="card abc"><summary><b>Cara kerja dan batasannya</b></summary><div class="wsm">

        <p><b>Resistensi intrinsik</b> dihitung sebagai tidak sensitif dan tidak dianggap sebagai data hilang. Isolat yang tidak diuji pada salah satu obat kombinasi dan tidak sensitif pada obat lainnya dikeluarkan dari penyebut regimen itu, karena statusnya tidak diketahui.</p>
        <p><b>Batasan.</b> Alat ini tidak menilai dosis, penetrasi jaringan, interaksi, toksisitas, biaya, atau luaran pasien. Data kultur bukan sampel acak seluruh pasien. Resistensi berubah menurut waktu dan unit, sehingga hasil perlu diperbarui secara berkala dan dibaca bersama pedoman setempat. Prior yang dipakai mengikuti implementasi paket AMR untuk R; teks asli Bielicki dkk. tidak dapat diakses penuh saat alat ini dibuat.</p></div></details>
